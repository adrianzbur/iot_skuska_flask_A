<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>História prevodov</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 2em auto; padding: 1em; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.5em; text-align: left; }
        th { background: #f3f4f6; }
        nav { margin-bottom: 1em; }
        nav a { margin-right: 1em; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Prevod</a>
        <a href="/historia">História</a>
    </nav>
    <h1>História prevodov</h1>
    <table>
        <thead>
            <tr>
                <th>Hodnota</th>
                <th>Typ prevodu</th>
                <th>Výsledok</th>
                <th>Čas</th>
            </tr>
        </thead>
        <tbody id="telo"></tbody>
    </table>

    <script>
        async function nacitaj() {
            const r = await fetch("/api/historia-prevodov");
            const data = await r.json();
            const telo = document.getElementById("telo");
            telo.innerHTML = data.map(p => `
                <tr>
                    <td>${p.hodnota}</td>
                    <!-- OPRAVA #5: stĺpce p.popis a p.typ boli prehodené — v hlavičke je najprv "Typ prevodu" potom "Výsledok", teda td musia zodpovedať tomuto poradiu -->
                    <td>${p.typ}</td>
                    <td>${p.popis}</td>
                    <td>${p.cas}</td>
                </tr>
            `).join("");
        }
        nacitaj();
    </script>
</body>
</html>
